<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Balloons</title>
  <style>
    :root {
      --rose: #e63946;
      --blush: #ff8fab;
      --cream: #fff7ed;
      --wine: #7f1d1d;
      --gold: #f59e0b;
      --sky: #ffd6e0;
      --paper: #fffaf5;
      --ink: #3f1d2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.7), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(255, 242, 245, 0.9), transparent 35%),
        linear-gradient(160deg, #ffccd5 0%, #ffe5ec 45%, #fff1f2 100%);
      position: relative;
    }

    .title {
      position: absolute;
      z-index: 5;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: min(90vw, 700px);
      padding: 0.8rem 1rem;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(230, 57, 70, 0.15);
      animation: fadeSlide 900ms ease-out both;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(1.15rem, 3vw, 2.1rem);
      letter-spacing: 0.05em;
      color: var(--wine);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .title p {
      margin: 0.15rem 0 0;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      color: #6b2136;
    }

    #sky {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .heart-cloud {
      position: absolute;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      color: rgba(255, 255, 255, 0.65);
      animation: driftCloud linear infinite;
      user-select: none;
    }

    #rose-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .rose-cloud {
      position: absolute;
      font-size: clamp(1.6rem, 3.8vw, 3rem);
      animation: driftCloud linear infinite;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(127, 29, 29, 0.16));
    }

    .bouquet-cloud {
      position: absolute;
      font-size: clamp(2rem, 4.8vw, 3.8rem);
      animation: driftCloud linear infinite;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 5px 10px rgba(127, 29, 29, 0.22));
    }

    #balloon-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: clamp(56px, 8vw, 86px);
      aspect-ratio: 0.72;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 12px 16px rgba(157, 23, 77, 0.22));
      pointer-events: auto;
    }

    .balloon:focus-visible {
      outline: 2px dashed #7f1d1d;
      outline-offset: 4px;
    }

    .balloon::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50% 50% 48% 48%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.8), transparent 35%),
        var(--c, var(--rose));
      border: 2px solid rgba(255, 255, 255, 0.6);
      clip-path: ellipse(46% 49% at 50% 47%);
      transform: rotate(-4deg);
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: clamp(48px, 9vw, 74px);
      background: linear-gradient(to bottom, rgba(127, 29, 29, 0.9), rgba(127, 29, 29, 0.2));
      left: 50%;
      bottom: -62px;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .balloon.pop {
      animation: popOut 240ms ease-out forwards;
      pointer-events: none;
    }

    .burst {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, var(--blush));
      transform: translate(-50%, -50%);
      animation: burst 650ms ease-out forwards;
      pointer-events: none;
      z-index: 6;
    }

    #frames {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
    }

    .photo-frame {
      position: absolute;
      width: clamp(150px, 23vw, 240px);
      aspect-ratio: 4 / 5;
      border: 10px solid var(--paper);
      border-bottom-width: 30px;
      border-radius: 14px;
      box-shadow:
        0 20px 26px rgba(127, 29, 29, 0.2),
        inset 0 0 0 2px rgba(229, 62, 62, 0.2);
      background: #fff;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(0.25) rotate(var(--r, 0deg));
      opacity: 0;
      animation: frameReveal 580ms cubic-bezier(.21, 1.35, .42, .97) forwards;
    }

    .photo-frame.fade-out {
      opacity: 0;
      transition: opacity 5s linear;
    }

    .photo {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 22%, rgba(255, 255, 255, 0.38), transparent 35%),
        linear-gradient(180deg, #ffeff3 0%, #ffe3ea 30%, #ffd8e4 100%);
    }

    .frame-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .photo-frame.loaded .frame-photo {
      opacity: 1;
    }

    .frame-loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.8);
      z-index: 1;
      transition: opacity 180ms ease;
    }

    .photo-frame.loaded .frame-loader,
    .photo-frame.load-failed .frame-loader {
      opacity: 0;
      pointer-events: none;
    }

    .frame-loader-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(229, 62, 62, 0.22);
      border-top-color: #e53e3e;
      animation: spin 700ms linear infinite;
    }

    .girl {
      position: absolute;
      inset: 8% 14% 14%;
    }

    .girl svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      text-align: center;
      font-size: clamp(0.72rem, 1.5vw, 0.95rem);
      letter-spacing: 0.04em;
      color: #7a1731;
    }

    .counter {
      position: absolute;
      z-index: 8;
      right: 1rem;
      bottom: 1rem;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.7);
      color: #7a1731;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      box-shadow: 0 6px 16px rgba(127, 29, 29, 0.16);
      backdrop-filter: blur(3px);
    }

    @keyframes floatUp {
      from { transform: translateY(108vh) rotate(0deg); }
      to { transform: translateY(-28vh) rotate(7deg); }
    }

    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.2); }
    }

    @keyframes frameReveal {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25) rotate(var(--r, 0deg)); }
      65% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(var(--r, 0deg)); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(var(--r, 0deg)); }
    }

    @keyframes driftCloud {
      from { transform: translateX(-12vw) translateY(0); }
      to { transform: translateX(112vw) translateY(-8vh); }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      .title {
        top: 0.55rem;
        width: min(94vw, 700px);
        padding: 0.6rem 0.75rem;
        border-radius: 20px;
        backdrop-filter: none;
      }
      .title h1 { font-size: clamp(1rem, 4.2vw, 1.35rem); }
      .title h3 { margin: 0.2rem 0 0; font-size: clamp(0.86rem, 3.3vw, 1rem); }
      .counter {
        bottom: 0.55rem;
        right: 0.55rem;
        font-size: 0.8rem;
        padding: 0.35rem 0.58rem;
        backdrop-filter: none;
      }
      .photo-frame {
        width: clamp(132px, 44vw, 198px);
        border-width: 8px;
        border-bottom-width: 22px;
      }
      .rose-cloud { font-size: clamp(1.35rem, 4.8vw, 2.35rem); }
      .bouquet-cloud { font-size: clamp(1.75rem, 5.8vw, 2.8rem); }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Yeswanth's little tribute to his Valentines ❤️</h1>
    <h3>Pop A Balloon, Reveal A Memory</h3>
  </div>

  <div id="sky" aria-hidden="true"></div>
  <div id="rose-layer" aria-hidden="true"></div>
  <div id="balloon-layer" aria-label="Floating balloons"></div>
  <div id="frames" aria-live="polite"></div>
  <div class="counter" id="counter">Frames opened: 0</div>
  <audio id="bg-music" src="audio/chandrullo_song.mp3" loop preload="auto"></audio>

  <template id="girl-template">
    <div class="photo-frame" role="img" aria-label="Framed photo">
      <div class="photo"></div>
      <img class="frame-photo" alt="Memory photo" loading="lazy" />
      <div class="frame-loader" aria-hidden="true">
        <span class="frame-loader-dot"></span>
      </div>
      <div class="caption">Sweet Valentine</div>
    </div>
  </template>

  <script>
    const balloonLayer = document.getElementById("balloon-layer");
    const frames = document.getElementById("frames");
    const sky = document.getElementById("sky");
    const roseLayer = document.getElementById("rose-layer");
    const counter = document.getElementById("counter");
    const girlTemplate = document.getElementById("girl-template");
    const bgMusic = document.getElementById("bg-music");

    const colors = ["#ff4d6d", "#f43f5e", "#fb7185", "#e11d48", "#f472b6", "#ec4899"];
    const isMobile = window.matchMedia("(max-width: 680px)").matches;
    const initialBalloonCount = isMobile ? 9 : 14;
    const heartCloudCount = isMobile ? 7 : 12;
    const roseCloudCount = isMobile ? 9 : 14;
    const bouquetCloudCount = isMobile ? 3 : 6;
    const burstParticleCount = isMobile ? 8 : 14;
    // Auto-loaded from photos/photos.json.
    let photoUrls = [];
    let photoIndex = 0;
    let openedFrames = 0;
    let didStartMusic = false;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function startThemeMusic() {
      if (!bgMusic || didStartMusic) return;
      bgMusic.volume = 0.35;
      const playPromise = bgMusic.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise
          .then(() => {
            didStartMusic = true;
          })
          .catch(() => {});
      } else {
        didStartMusic = true;
      }
    }

    function createHeartClouds() {
      const count = heartCloudCount;
      for (let i = 0; i < count; i++) {
        const cloud = document.createElement("div");
        cloud.className = "heart-cloud";
        cloud.textContent = "\u2665";
        cloud.style.top = `${random(8, 85)}%`;
        cloud.style.left = `${random(-10, 90)}%`;
        cloud.style.opacity = String(random(0.22, 0.6));
        cloud.style.animationDuration = `${random(18, 42)}s`;
        cloud.style.animationDelay = `${random(-35, 0)}s`;
        sky.appendChild(cloud);
      }
    }

    function createRoseClouds() {
      const roseChars = ["\u{1F339}", "\u{1F338}", "\u{1F33A}"];
      const count = roseCloudCount;
      for (let i = 0; i < count; i++) {
        const rose = document.createElement("div");
        rose.className = "rose-cloud";
        rose.textContent = roseChars[Math.floor(Math.random() * roseChars.length)];
        rose.style.top = `${random(8, 86)}%`;
        rose.style.left = `${random(-12, 92)}%`;
        rose.style.opacity = String(random(0.22, 0.5));
        rose.style.animationDuration = `${random(20, 44)}s`;
        rose.style.animationDelay = `${random(-38, 0)}s`;
        roseLayer.appendChild(rose);
      }
    }

    function createBouquetClouds() {
      const bouquetChars = ["\u{1F490}", "\u{1F33B}\u{1F339}"];
      const count = bouquetCloudCount;
      for (let i = 0; i < count; i++) {
        const bouquet = document.createElement("div");
        bouquet.className = "bouquet-cloud";
        bouquet.textContent = bouquetChars[Math.floor(Math.random() * bouquetChars.length)];
        bouquet.style.top = `${random(10, 84)}%`;
        bouquet.style.left = `${random(-14, 88)}%`;
        bouquet.style.opacity = String(random(0.2, 0.42));
        bouquet.style.animationDuration = `${random(24, 50)}s`;
        bouquet.style.animationDelay = `${random(-42, 0)}s`;
        roseLayer.appendChild(bouquet);
      }
    }

    function popBurst(x, y, color) {
      for (let i = 0; i < burstParticleCount; i++) {
        const dot = document.createElement("span");
        dot.className = "burst";
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        dot.style.setProperty("--c", color);
        dot.style.setProperty("--x", `${Math.cos((i / burstParticleCount) * Math.PI * 2) * random(isMobile ? 24 : 30, isMobile ? 58 : 80)}px`);
        dot.style.setProperty("--y", `${Math.sin((i / burstParticleCount) * Math.PI * 2) * random(isMobile ? 24 : 30, isMobile ? 58 : 80)}px`);
        balloonLayer.appendChild(dot);
        dot.addEventListener("animationend", () => dot.remove(), { once: true });
      }
    }

    function revealFrame(x, y, photoUrl) {
      const clone = girlTemplate.content.firstElementChild.cloneNode(true);
      const safeX = Math.min(Math.max(x, 95), window.innerWidth - 95);
      const safeY = Math.min(Math.max(y, 120), window.innerHeight - 130);
      const photo = clone.querySelector(".frame-photo");
      const markLoaded = () => clone.classList.add("loaded");
      const markLoadFailed = () => clone.classList.add("load-failed");
      if (photo && photoUrl) {
        photo.addEventListener("load", markLoaded, { once: true });
        photo.addEventListener("error", markLoadFailed, { once: true });
        photo.src = photoUrl;
        if (photo.complete && photo.naturalWidth > 0) {
          markLoaded();
        }
      } else {
        markLoadFailed();
      }
      clone.style.left = `${safeX}px`;
      clone.style.top = `${safeY}px`;
      clone.style.setProperty("--r", `${random(-9, 9)}deg`);
      frames.appendChild(clone);
      setTimeout(() => {
        const frozenTransform = getComputedStyle(clone).transform;
        clone.style.animation = "none";
        clone.style.transform = frozenTransform;
        clone.style.opacity = "1";
        void clone.offsetWidth;
        clone.classList.add("fade-out");
      }, 580);
      setTimeout(() => clone.remove(), 5580);
      openedFrames += 1;
      counter.textContent = `Frames opened: ${openedFrames}`;
    }

    async function loadPhotoUrls() {
      try {
        const response = await fetch("photos/photos.json", { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        if (!Array.isArray(data)) return;
        photoUrls = data
          .filter((item) => typeof item === "string" && item.trim().length > 0)
          .sort((a, b) => a.localeCompare(b));
        photoIndex = 0;
      } catch (error) {
        // Keep empty list if manifest is unavailable.
      }
    }

    function getNextPhotoUrl() {
      if (!photoUrls.length) return null;
      const next = photoUrls[photoIndex % photoUrls.length];
      photoIndex = (photoIndex + 1) % photoUrls.length;
      return next;
    }

    function createBalloon(index) {
      const button = document.createElement("button");
      const c = colors[index % colors.length];
      button.className = "balloon";
      button.type = "button";
      button.setAttribute("aria-label", "Pop this balloon");
      button.style.left = `${random(4, 92)}%`;
      button.style.animationDuration = `${random(10, 18)}s`;
      button.style.animationDelay = `${random(-16, 0)}s`;
      button.style.setProperty("--c", c);

      button.addEventListener("click", (event) => {
        if (button.classList.contains("pop")) return;
        startThemeMusic();
        const rect = button.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const photoUrl = getNextPhotoUrl();
        button.classList.add("pop");
        popBurst(cx, cy, c);
        revealFrame(cx, cy, photoUrl);
        button.addEventListener("animationend", () => {
          button.remove();
          createBalloon(index + initialBalloonCount + Math.floor(Math.random() * 3));
        }, { once: true });
      });

      balloonLayer.appendChild(button);
    }

    async function init() {
      createHeartClouds();
      createRoseClouds();
      createBouquetClouds();
      document.addEventListener("pointerdown", startThemeMusic, { once: true });
      await loadPhotoUrls();
      for (let i = 0; i < initialBalloonCount; i++) {
        createBalloon(i);
      }
    }

    init();
  </script>
</body>
</html>
